name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Creer le projet Android
        run: npx --yes cap add android

      - name: Sauvegarder les ressources d'origine
        run: cp -r android/app/src/main/res /tmp/res_orig

      - name: Personnaliser icone, ecran de demarrage et animation
        continue-on-error: true
        run: |
          pip install pillow
          python personnaliser_android.py android/app/src/main/res www/index.html

      - name: Copier l'application dans le projet
        run: npx --yes cap sync android

      - name: Compiler l'APK
        id: build1
        continue-on-error: true
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Compiler l'APK (secours avec les ressources d'origine)
        if: steps.build1.outcome == 'failure'
        working-directory: android
        run: |
          rm -rf app/src/main/res
          cp -r /tmp/res_orig app/src/main/res
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: longueur-vis-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
